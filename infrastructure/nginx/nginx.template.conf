events {}

http {

  include mime.types;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  upstream frontend {
      server frontend:3000;
  }

  upstream backend {
      server backend:3003;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Red local — certificado autofirmado
  server {
    listen 443 ssl;
    server_name ${API_HOST};

    ssl_certificate     /etc/nginx/infrastructure/certs/casademiranda.crt;
    ssl_certificate_key /etc/nginx/infrastructure/certs/casademiranda.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/proxy-locations.conf;
  }

  # Tailscale — certificado válido para acceso remoto
  server {
    listen 443 ssl;
    server_name ${TAILSCALE_HOSTNAME};

    ssl_certificate     /etc/nginx/tailscale-certs/${TAILSCALE_HOSTNAME}.crt;
    ssl_certificate_key /etc/nginx/tailscale-certs/${TAILSCALE_HOSTNAME}.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/proxy-locations.conf;
  }
}
